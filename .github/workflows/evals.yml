name: evals

# Behavior evals (testing). The blocking CI only ever runs the STATIC
# scenario gate (no LLM, no secrets); live scenarios drive a real agent CLI and
# must be run locally (see evals/README.md). This workflow adds a scheduled +
# manual static check so scenario drift is caught outside PRs.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  static:
    name: evals-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: validate eval scenarios
        run: python3 scripts/coacus_eval.py validate
