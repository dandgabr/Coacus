name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: install required language detector
        run: python -m pip install --disable-pip-version-check lingua-language-detector==2.2.0 wordfreq==3.1.1
      - name: validate sources
        run: python3 scripts/coacus.py validate
      # NEVER run `generate` here: it rewrites the files under comparison and
      # would silently mask drift. Regenerate locally and commit instead.
      - name: drift check
        run: python3 scripts/coacus.py check
      - name: completeness check
        run: python3 scripts/coacus.py completeness
      - name: tests
        run: python3 -m unittest discover -s tests

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: gitleaks (pinned, checksum-verified)
        run: python scripts/coacus_secrets.py

  portable-hooks:
    name: portable hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: run portable hook and workflow contracts
        run: python -m unittest tests.test_python_only_hooks tests.test_python_only_validator tests.test_workflow_helpers tests.test_governor_hook tests.test_secrets_runner
      # The installer test module uses tomllib; keep the hook floor at 3.10
      # and run installer contracts on the same interpreter as the full suite.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: run portable legacy migration and probe safety contracts
        run: >-
          python -m unittest
          tests.test_command_code_mod_probe
          tests.test_install.TestInstaller.test_install_text_bytes_use_native_newlines
          tests.test_install.TestInstaller.test_legacy_matching_file_edited_after_check_is_not_overwritten
          tests.test_install.TestInstaller.test_legacy_divergence_requires_explicit_backup_and_preserves_original
          tests.test_install.TestInstaller.test_legacy_backup_aborts_if_file_changes_during_backup
          tests.test_install.TestInstaller.test_legacy_edit_after_final_check_is_preserved
          tests.test_install.TestInstaller.test_legacy_replacement_refuses_new_file_created_after_rename
          tests.test_install.TestInstaller.test_legacy_edit_after_replacement_is_not_adopted_as_managed
          tests.test_install.TestInstaller.test_legacy_replacement_fails_safely_when_rename_is_unavailable
          tests.test_install.TestInstaller.test_legacy_replacement_closes_descriptor_if_fdopen_fails
          tests.test_install.TestInstaller.test_legacy_replacement_does_not_follow_late_symlink
