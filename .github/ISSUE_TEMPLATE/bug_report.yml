name: Bug report
description: Report reproducible behavior that appears to be incorrect.
title: "[Unexpected behavior]: "
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first. Remove credentials, tokens, personal data
        and other sensitive information from logs before including them.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Describe the behavior that appears to be incorrect.
      placeholder: A concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reproduces the behavior.
      placeholder: |-
        1. Run a command.
        2. Check the result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include redacted error output when useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Coacus revision, harness, operating system and Python version. Write "Not applicable" for details that do not apply.
      placeholder: Coacus revision / harness / OS / Python version, or Not applicable
    validations:
      required: true
