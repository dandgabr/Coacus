<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU ink and image transitions</title>
<style>
  :root { color-scheme: dark; font: 100%/1.55 system-ui, sans-serif; }
  body { margin: 0; background: #121921; color: #edf4f7; }
  main { inline-size: min(42rem, calc(100% - 2rem)); margin: 2rem auto; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.5rem); line-height: 1.1; }
  .controls { margin-block: 1rem; }
  .controls:not([hidden]) { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  button { font: inherit; padding: 0.5rem 0.85rem; border: 1px solid #a0b7c4;
    border-radius: 0.35rem; background: #223643; color: #edf4f7; }
  button:disabled { opacity: 0.65; }
  button[aria-pressed="true"] { background: #b7e9de; color: #10232c; }
  button:focus-visible, a:focus-visible { outline: 3px solid #fabc79; outline-offset: 4px; }
  a { color: #a9e3ef; }
  #stage { position: relative; aspect-ratio: 16 / 9; isolation: isolate; border-radius: 0.65rem;
    overflow: hidden; touch-action: pan-y; }
  .poster, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  canvas { visibility: hidden; }
  .poster { background:
    radial-gradient(ellipse at 57% 51%, #98ded1 0%, #469f9f 9%, #205d70 20%, transparent 37%),
    radial-gradient(ellipse at 37% 57%, #236d81 0%, transparent 28%), #101e2d; }
  [data-effect="images"][data-scene="tide"] .poster { background:
    radial-gradient(circle at 27% 32%, #d9f7ed 0 6%, transparent 6.5%),
    radial-gradient(ellipse 80% 48% at 42% 106%, #123f57 99%, transparent),
    radial-gradient(ellipse 75% 52% at 72% 105%, #2e7a8c 99%, transparent), #11233d; }
  [data-effect="images"][data-scene="dawn"] .poster { background:
    radial-gradient(circle at 73% 32%, #ffd17d 0 6%, transparent 6.5%),
    radial-gradient(ellipse 80% 49% at 78% 102%, #66304c 99%, transparent),
    radial-gradient(ellipse 72% 48% at 22% 104%, #d4695c 99%, transparent), #3d1c33; }
  @media (forced-colors: active) {
    #stage { border: 1px solid CanvasText; }
    button[aria-pressed="true"] { border: 2px solid Highlight; }
    button:focus-visible, a:focus-visible { outline-color: Highlight; }
  }
</style>
<main>
  <h1>GPU ink and image transitions</h1>
  <div class="controls" id="modes" hidden>
    <button type="button" id="ink-mode" aria-pressed="true">Fluid ink</button>
    <button type="button" id="image-mode" aria-pressed="false">Landscape images</button>
  </div>
  <div id="stage">
    <div class="poster" aria-hidden="true"></div>
    <canvas id="effect" aria-hidden="true"></canvas>
  </div>
  <div class="controls" id="actions" hidden>
    <button type="button" id="burst" disabled>Add ink</button>
    <button type="button" id="swap" hidden>Reveal dawn</button>
    <output id="scene-name" aria-live="polite" hidden>Tide landscape</output>
  </div>
  <p id="ink-instructions" hidden>Drag across the ink to move the dye.</p>
  <p><a href="#notes">About the examples</a></p>
  <p id="notes">The fluid ink illustration and the Tide and Dawn landscapes are decorative.</p>
  <pre id="results" hidden></pre>
</main>
<script type="module">
  import { mountFeedback } from './feedback.js'

  const stage = document.querySelector('#stage')
  const canvas = document.querySelector('#effect')
  const query = new URLSearchParams(location.search)
  if (query.has('checks')) {
    const results = document.querySelector('#results')
    results.hidden = false
    try {
      const { runChecks } = await import('./feedback-checks.js')
      results.textContent = JSON.stringify(await runChecks(), null, 2)
    } catch (error) {
      results.textContent = 'FAIL: ' + error.message
      throw error
    }
  } else if (!query.has('static')) {
    const inkMode = document.querySelector('#ink-mode')
    const imageMode = document.querySelector('#image-mode')
    const burst = document.querySelector('#burst')
    const swap = document.querySelector('#swap')
    const name = document.querySelector('#scene-name')
    const instructions = document.querySelector('#ink-instructions')
    const mount = () => mountFeedback(stage, canvas, {
      onInkAvailabilityChange(available) {
        const moveFocus = !available && document.activeElement === burst
        burst.disabled = instructions.hidden = !available
        if (moveFocus) inkMode.focus()
      }
    })
    let controller = mount()
    const setMode = mode => {
      controller.setMode(mode)
      const ink = mode === 'ink'
      inkMode.setAttribute('aria-pressed', String(ink))
      imageMode.setAttribute('aria-pressed', String(!ink))
      burst.hidden = !ink
      swap.hidden = name.hidden = ink
    }
    inkMode.addEventListener('click', () => setMode('ink'))
    imageMode.addEventListener('click', () => setMode('images'))
    burst.addEventListener('click', () => controller.burst())
    swap.addEventListener('click', () => {
      controller.toggleScene()
      const dawn = controller.snapshot().destination === 1
      swap.textContent = dawn ? 'Reveal tide' : 'Reveal dawn'
      name.value = dawn ? 'Dawn landscape' : 'Tide landscape'
    })
    document.querySelector('#modes').hidden = false
    document.querySelector('#actions').hidden = false
    addEventListener('pagehide', () => controller.destroy())
    addEventListener('pageshow', event => {
      if (!event.persisted) return
      controller = mount()
      setMode('ink')
      swap.textContent = 'Reveal dawn'
      name.value = 'Tide landscape'
    })
  }
</script>
</html>
